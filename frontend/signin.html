<script>
const supabaseUrl = "https://tmxxjzqzukphngjfkizs.supabase.co";
const supabaseKey = "sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy";
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // 1. Attempt login
    const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (authError) {
        alert("Login failed: " + authError.message);
        return;
    }

    // 2. Check if this user is in our 'authorized_admins' table
    const { data: adminData, error: adminError } = await _supabase
        .from('authorized_admins')
        .select('email')
        .eq('email', email)
        .single();

    if (adminError || !adminData) {
        alert("Access Denied: You are not on the authorized admin list.");
        // Log them back out immediately if they aren't authorized
        await _supabase.auth.signOut();
    } else {
        // Success! Go to dashboard
        window.location.href = 'dashboard.html';
    }
});  
</script>
