<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>

                        "DEFAULT": "1rem",
                        "lg": "2rem",

                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: "Plus Jakarta Sans", sans-serif;
            }
        }
        .full-page-tea-bg {
            /* Replace with your actual tea background image URL */
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCDFBgXsEdjAlowdbX0XQI1ZZ9GmYmK8FV0bfskM_HEU_M6cY0CesAvlkbxccqRzdKDq1VUAOdHNfaJu1_Msqtij9jYN9l0kj2ixkLBcvvP3tRAsWutUn4AcvImMrjZJxTJSJq6jRvRxJNjoTtSHpBIkeHqcoYizbSS9l-1AMpj0c21UmjLbfPQYMe04FAnKTOsfHUy1oYcT_hPwt_wXQrkFRJjoZD1WVu0gmGO-Q7mTcKCoJuvM7RTAkkA8worHCNBU1VIfLkLCY8');

            background-position: center;
            position: relative;

        .full-page-tea-bg::before {
            content: "";

<body class="bg-background-light dark:bg-background-dark h-screen w-full flex items-center justify-center font-display text-slate-900 dark:text-slate-100 overflow-hidden">

    <div class="relative w-full max-w-[430px] h-full sm:h-[90vh] sm:max-h-[850px] sm:rounded-[3rem] overflow-hidden shadow-2xl full-page-tea-bg flex flex-col border-white/20 sm:border">
        
        <div class="relative z-10 flex flex-col h-full">
            <nav class="flex items-center px-6 pt-8 sm:pt-12 mb-4">
    <a href="landing-page.html" class="flex items-center justify-center size-10 rounded-full bg-white/40 dark:bg-black/20 backdrop-blur-md border border-white/30 dark:border-white/10 hover:bg-white/60 transition-all">
        <span class="material-symbols-outlined text-slate-900 dark:text-slate-100 text-xl leading-none">arrow_back_ios_new</span>
    </a>
</nav>

            <header class="mb-6 px-6 text-center">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2 text-slate-900 dark:text-white drop-shadow-sm">Enter your phone number</h1>
                <p class="text-slate-700 dark:text-slate-300 text-sm sm:text-base font-medium">We'll send you a code to verify your profile.</p>
            </header>

  <div class="px-6 space-y-4 flex-none">
    <div class="flex flex-col gap-3">
        <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-emerald-900 dark:text-emerald-400 mb-1 ml-1">Full Name <span class="text-red-500">*</span></label>
            <input id="name-input" type="text" placeholder="Enter your name" class="w-full h-12 bg-white/90 dark:bg-black/40 backdrop-blur-md border border-white/50 dark:border-white/10 rounded-2xl px-4 text-base font-bold focus:ring-2 focus:ring-primary outline-none transition-all">
        </div>

        <div class="flex gap-2">
            <div class="w-24">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-emerald-900 dark:text-emerald-400 mb-1 ml-1">Country</label>
                <select id="country-code" class="w-full h-12 bg-white/90 dark:bg-black/40 border border-white/50 dark:border-white/10 rounded-2xl px-2 text-sm font-bold focus:ring-2 focus:ring-primary outline-none">
                    <option value="+91">in +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">uk +44</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-[10px] font-bold uppercase tracking-widest text-emerald-900 dark:text-emerald-400 mb-1 ml-1">Phone Number <span class="text-red-500">*</span></label>
                <input class="w-full h-12 bg-white/90 dark:bg-black/40 border border-white/50 dark:border-white/10 rounded-2xl px-4 text-lg font-bold tracking-widest outline-none" id="phone-display" placeholder="0000000000" type="text" inputmode="numeric"/>
            </div>
        </div>
    </div>
    
    <button onclick="showConfirmation()" class="w-full h-12 bg-emerald-600 dark:bg-primary text-white dark:text-background-dark rounded-full font-bold text-base shadow-lg hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <span>Continue</span>
        <span class="material-symbols-outlined">arrow_forward</span>
    </button>
</div>

<div class="mt-auto bg-slate-100/80 dark:bg-black/70 backdrop-blur-2xl border-t border-white/20 p-2 grid grid-cols-3 gap-2">
    <button class="ios-keypad-btn" onclick="addNumber('1')">1</button>
    <button class="ios-keypad-btn" onclick="addNumber('2')">2</button>
    <button class="ios-keypad-btn" onclick="addNumber('3')">3</button>
    <button class="ios-keypad-btn" onclick="addNumber('4')">4</button>
    <button class="ios-keypad-btn" onclick="addNumber('5')">5</button>
    <button class="ios-keypad-btn" onclick="addNumber('6')">6</button>
    <button class="ios-keypad-btn" onclick="addNumber('7')">7</button>
    <button class="ios-keypad-btn" onclick="addNumber('8')">8</button>
    <button class="ios-keypad-btn" onclick="addNumber('9')">9</button>
    <div class="h-12"></div>
    <button class="ios-keypad-btn" onclick="addNumber('0')">0</button>
    <button class="h-12 flex items-center justify-center active:opacity-40" onclick="backspace()">
        <span class="material-symbols-outlined text-2xl">backspace</span>
    </button>
</div>

<div id="confirm-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm hidden">
    <div class="bg-white dark:bg-background-dark w-full max-w-sm rounded-[2rem] p-8 shadow-2xl text-center">
        <h3 class="text-xl font-bold mb-2">Is this correct?</h3>
        <p class="text-slate-500 mb-6">We will call you at:<br><span id="display-final-num" class="text-slate-900 dark:text-white font-bold text-lg"></span></p>
        <div class="space-y-3">
            <button onclick="submitData(event)" class="w-full py-4 bg-emerald-600 dark:bg-primary text-white dark:text-background-dark rounded-full font-bold">Yes, it's correct</button>
            <button onclick="hideConfirmation()" class="w-full py-4 bg-slate-100 dark:bg-white/5 rounded-full font-bold">No, edit number</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

SUPABASE_URL="https://tmxxjzqzukphngjfkizs.supabase.co"
SUPABASE_KEY="sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy"
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    function addNumber(num) {
        const display = document.getElementById('phone-display');
        if(display.value.length < 10) {
            display.value += num;
        }
    }

    function backspace() {
        const display = document.getElementById('phone-display');
        display.value = display.value.slice(0, -1);
    }

    function showConfirmation() {
        const name = document.getElementById('name-input').value;
        const phone = document.getElementById('phone-display').value;
        const code = document.getElementById('country-code').value;

        if (!name) { alert("Please enter your name"); return; }
        if (phone.replace(/\D/g, '').length < 10) { alert("Please enter your 10-digit phone number"); return; }

        document.getElementById('display-final-num').innerText = code + " " + phone;
        document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function hideConfirmation() {
        document.getElementById('confirm-modal').classList.add('hidden');
    }

    async function submitData() {
    const nameInput = document.getElementById('name-input');
    const phoneDisplay = document.getElementById('phone-display');
    const countryCode = document.getElementById('country-code');

    const name = nameInput.value;
    const fullPhone = countryCode.value + phoneDisplay.value;

    // Change button text to show it's working
    const confirmBtn = event.target; 
    const originalText = confirmBtn.innerText;
    confirmBtn.innerText = "Saving...";
    confirmBtn.disabled = true;

    try {
        // 1. Insert into Supabase 'leads' table
        const { data, error } = await _supabase
            .from('leads')
            .insert([
                { full_name: name, phone_number: fullPhone }
            ]);

        if (error) throw error;

        // 2. Success! Redirect to chatbot
        window.location.href = `chatbot-ui.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(fullPhone)}`;

    } catch (error) {
        console.error("Error saving to Supabase:", error.message);
        alert("Failed to save. Please check your connection.");
        confirmBtn.innerText = originalText;
        confirmBtn.disabled = false;
    }
    }
</script>         
</body>
</html>
