<!-- Top Header -->

<!-- Chat Area -->
<main class="relative z-10 flex-1 overflow-y-auto p-4 space-y-6 flex flex-col" id="chat-main"><div class="flex justify-center"><span class="text-[11px] font-bold text-tea-medium/60 uppercase tracking-widest bg-primary/5 px-3 py-1 rounded-full">Today</span></div></main>
<!-- Input Area -->

<button class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center size-8 rounded-xl bg-primary text-tea-dark shadow-sm hover:scale-105 active:scale-95 transition-transform" id="send-btn">

<!-- Bottom Indicator -->
<div class="h-1.5 w-32 bg-slate-300 dark:bg-slate-700 mx-auto mt-6 rounded-full opacity-50"></div>
</footer><script>
const chatMain = document.getElementById('chat-main');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function addMessage(text, isAi) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `flex items-end gap-3 ${isAi ? 'justify-start' : 'justify-end'} group animate-in fade-in slide-in-from-bottom-2 duration-300 w-full`;
  
  const iconHtml = isAi 
    ? '<div class="bg-primary rounded-full w-8 h-8 flex items-center justify-center shadow-md shadow-primary/20 shrink-0"><span class="material-symbols-outlined text-tea-dark text-lg">psychology</span></div>'
    : '<div class="bg-primary/20 rounded-full w-8 h-8 flex items-center justify-center border border-primary/30 shrink-0"><span class="material-symbols-outlined text-tea-dark text-sm">person</span></div>';

  // --- THE BRACKET MAGIC HAPPENS HERE ---
  let displayHtml = text;
  let buttonsHtml = '';
  
  if (isAi) {
      // Find anything inside [ ]
      const buttonRegex = /\[(.*?)\]/g;
      const matches = [...text.matchAll(buttonRegex)];
      
      if (matches.length > 0) {
          // Remove the brackets from the main text
          displayHtml = text.replace(buttonRegex, '').trim();
          
          // Generate the HTML for the buttons
          buttonsHtml = '<div class="flex flex-wrap gap-2 mt-3">';
          matches.forEach(match => {
              const btnText = match[1];
              // When clicked, it automatically sends the button text to the AI
              buttonsHtml += `<button onclick="handleSend('${btnText}')" class="text-xs font-bold bg-primary/20 text-tea-dark border border-primary/40 px-4 py-2 rounded-full hover:bg-primary/40 hover:scale-105 active:scale-95 transition-all shadow-sm">${btnText}</button>`;
          });
          buttonsHtml += '</div>';
      }
  }
  // --------------------------------------

  const contentHtml = `
    <div class="flex ${isAi ? 'flex-1' : ''} flex-col gap-1 items-${isAi ? 'start' : 'end'}">
      <p class="text-tea-medium dark:text-primary/70 text-[11px] font-bold uppercase tracking-tighter px-2">${isAi ? 'Charan Singh & Sons AI' : 'You'}</p>
      <div class="text-white text-sm font-medium leading-relaxed max-w-[85%] rounded-2xl ${isAi ? 'rounded-tl-none bg-tea-medium' : 'rounded-tr-none bg-tea-dark'} px-4 py-3 shadow-sm">
        ${displayHtml}
        ${buttonsHtml}
      </div>
    </div>
  `;

  msgDiv.innerHTML = isAi ? iconHtml + contentHtml : contentHtml + iconHtml;
  chatMain.appendChild(msgDiv);
  chatMain.scrollTop = chatMain.scrollHeight;
  }

function parseAmountFromText(text) {
  let cleaned = text.replace(/,/g, '');

  // Remove quantity mentions like "2 kg", "3kg", "50 g", "100g" so they don't get mistaken for totals.
  cleaned = cleaned.replace(/\b\d+(?:\.\d+)?\s*(?:kg|kgs|kilogram|kilograms|g|gram|grams|ltr|liter|litre|ml|pcs|pieces|pack|packs|packet|packets)\b/gi, '');

  // Prefer explicit totals with arithmetic expressions, e.g. "total bill is 2000 + 350 = 2350 rupees".
  const explicitSumMatch = cleaned.match(/(?:total|grand total|final total|amount to pay|amount due|bill amount|total amount|order total|invoice total|total bill|amount is|total is|final amount|net amount)[^=]{0,80}=\s*([0-9]+(?:\.[0-9]{1,2})?)/i);
  if (explicitSumMatch && explicitSumMatch[1]) {
      return String(parseFloat(explicitSumMatch[1]) || 0);
  }

  // Prefer explicit total phrases followed by a rupee amount.
  const explicitTotalMatch = cleaned.match(/(?:total|grand total|final total|amount to pay|amount due|bill amount|total amount|order total|invoice total|total bill|amount is|total is|final amount|net amount).*?([0-9]+(?:\.[0-9]{1,2})?)\s*(?:rupees|INR|Rs|₹)/i);
  if (explicitTotalMatch && explicitTotalMatch[1]) {
      return String(parseFloat(explicitTotalMatch[1]) || 0);
  }

  // Look for rupee amounts after total keywords.
  const rupeeMatches = [...cleaned.matchAll(/([0-9]+(?:\.[0-9]{1,2})?)\s*(?:rupees|INR|Rs|₹)/gi)].map(match => parseFloat(match[1]));
  if (rupeeMatches.length > 0 && hasTotalKeywords(cleaned)) {
      return String(Math.max(...rupeeMatches));
  }

  // Fallback: if the message mentions total, choose the largest number over 10.
  if (hasTotalKeywords(cleaned)) {
      const allNumbers = cleaned.match(/\d+(?:\.\d{1,2})?/g);
      if (allNumbers && allNumbers.length > 0) {
          const numbers = allNumbers.map(n => parseFloat(n)).filter(n => n > 10);
          if (numbers.length > 0) {
              return String(Math.max(...numbers));
          }
      }
  }

  return null;
}

function hasTotalKeywords(text) {
  const cleaned = text.replace(/,/g, '');
  return /(?:total amount|amount to pay|amount due|grand total|final total|bill amount|total bill|order total|invoice total|total is|amount is|comes to|comes out to|equals?)/i.test(cleaned);
}

function shouldStoreTotal(text) {
  return hasTotalKeywords(text);
}

// Notice handleSend now accepts an optional parameter!
async function handleSend(buttonText = null) {
  const text = buttonText || chatInput.value.trim();
  if (!text) return;

// --- REDIRECTION INTERCEPTOR ---
  if (text === "Proceed to Payment") {
      const aiMessages = chatMain.querySelectorAll('.bg-tea-medium');
      let finalAmount = "0";

      if (aiMessages.length > 0) {
              // Search backwards through AI messages to find the bill/total message.
              // We may still need to parse the same message that has "Order saved!".
              for (let i = aiMessages.length - 1; i >= 0; i--) {
                  const msgText = aiMessages[i].innerText;
                  console.log(`Checking message ${i}:`, msgText); // Debug log
              const parsedAmount = parseAmountFromText(msgText);
              if (parsedAmount && parsedAmount !== "0") {
                  finalAmount = parsedAmount;
                  console.log(`Found amount: ${finalAmount} from message:`, msgText); // Debug log
                  break;
              }
          }
      }

      // If still 0, try one more time with all messages and be more aggressive
      if (finalAmount === "0") {
          for (let i = aiMessages.length - 1; i >= 0; i--) {
              const msgText = aiMessages[i].innerText;
              // Look for any number > 50 (likely a total, not a quantity)
              const highNumbers = msgText.match(/\b(\d{2,})\b/g);
              if (highNumbers) {
                  const validNumbers = highNumbers.map(n => parseInt(n)).filter(n => n > 50);
                  if (validNumbers.length > 0) {
                      finalAmount = String(Math.max(...validNumbers));
                      console.log(`Found high number amount: ${finalAmount} from message:`, msgText);
                      break;
                  }
              }
          }
      }

      const storedAmount = localStorage.getItem("intelliTeaTotal");
      if ((finalAmount === "0" || !finalAmount) && storedAmount && parseFloat(storedAmount) > 10) {
          finalAmount = storedAmount;
      }

      if (!finalAmount || parseFloat(finalAmount) <= 10) {
          localStorage.removeItem("intelliTeaTotal");
          addMessage("I could not detect a valid total amount from the chat bill. Please review the AI response or ask the AI to re-send the final total.", true);
          return;
      }

      console.log(`Final amount to store: ${finalAmount}`); // Debug log
      localStorage.setItem("intelliTeaTotal", finalAmount);

      addMessage(`Final Total: ₹${finalAmount}. Opening payment...`, true);

      setTimeout(() => {
          window.location.href = "payment.html";
      }, 800);

      return;
  }

    // 4. Save to browser memory
   // localStorage.setItem("intelliTeaTotal", finalAmount);

    //addMessage("Opening secure UPI gateway...", true);
    //setTimeout(() => {
      //  window.location.href = "payment.html";
    //}, 1200);
    //return;


  // If the user clicks the about button, redirect them immediately!
  if (text === "Know About") {
      addMessage("Taking you to our story...", true);
      setTimeout(() => {
          // Change this to your actual about page URL
          window.location.href = "about-page.html"; 
      }, 1500);
     console.log("empty"); 
  }
  // --------------------------------

  addMessage(text, false);
  if (!buttonText) chatInput.value = ''; 

  try {
    const response = await fetch("http://localhost:5000/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (response.ok) {
        addMessage(data.reply, true);
        const parsedAmount = parseAmountFromText(data.reply);
        if (parsedAmount && parseFloat(parsedAmount) > 10 && hasTotalKeywords(data.reply)) {
            localStorage.setItem("intelliTeaTotal", parsedAmount);
        }
    } else {
        addMessage("Oops! Server error: " + data.error, true);
    }

  } catch (error) {
    console.error("Connection Error:", error);
    addMessage("Server disconnected?", true);
  }
}

sendBtn.addEventListener('click', () => handleSend());
chatInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSend();
});

// Initial greeting to trigger the AI
window.addEventListener('load', () => {
  // Silently trigger the backend so it gives us the first buttons immediately
  setTimeout(() => {
     handleSend("Hello");
     // We temporarily remove the default fake message so the real AI takes over
     chatMain.innerHTML = '<div class="flex justify-center"><span class="text-[11px] font-bold text-tea-medium/60 uppercase tracking-widest bg-primary/5 px-3 py-1 rounded-full">Today</span></div>';
  }, 500);
});
</script>
