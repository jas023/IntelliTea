function validateAddressText(address) {
  const text = (address || "").trim();
  if (text.length < 15) {
    return { valid: false, message: "Please enter a complete delivery address (minimum 15 characters)." };
  }

  const normalized = text.replace(/\s+/g, ' ').trim();
  const alphaWords = normalized.match(/[A-Za-z]{3,}/g) || [];
  if (alphaWords.length < 3) {
    return { valid: false, message: "Please include a full address with locality, city and state details." };
  }

  if (normalized.split(',').length < 2) {
    return { valid: false, message: "Please separate address parts using commas (for example: house, area, city, pincode)." };
  }

  if (/(.)\1{5,}/.test(normalized)) {
    return { valid: false, message: "Address seems invalid. Please enter meaningful address details." };
  }

  const lower = normalized.toLowerCase();
  const addressKeywords = /(house|flat|apt|apartment|road|rd|street|st|lane|ln|nagar|colony|sector|block|village|town|city|near|district|tehsil|po|post)/;
  if (!addressKeywords.test(lower)) {
    return { valid: false, message: "Please include proper address details like house/flat, road/area, city and pincode." };
  }

  // Require a non-pincode numeric token (house/flat/building number).
  const hasNonPincodeNumber = /\b\d{1,5}[a-zA-Z]?\b/.test(lower.replace(/\b\d{6}\b/g, ''));
  if (!hasNonPincodeNumber) {
    return { valid: false, message: "Please include house/flat number along with the full address." };
  }

  // Reject likely gibberish words without vowels (e.g., "dfagbbbbbb").
  const meaningfulWords = alphaWords.filter(w => /[aeiou]/i.test(w));
  if (meaningfulWords.length < 2) {
    return { valid: false, message: "Address appears invalid. Please enter a real locality, city and state." };
  }

  const uniqueWords = new Set(alphaWords.map(w => w.toLowerCase()));
  if (uniqueWords.size < 3) {
    return { valid: false, message: "Please avoid repeated/random words and enter a proper delivery address." };
  }

  const pinMatch = text.match(/\b\d{6}\b/);
  if (!pinMatch) {
    return { valid: false, message: "Please include a valid 6-digit pincode in your address." };
  }

  if (!/[a-zA-Z]/.test(text)) {
    return { valid: false, message: "Address looks invalid. Please include street/locality and city details." };
  }

  if (!/[0-9]/.test(text)) {
    return { valid: false, message: "Please include house/flat number and pincode in your address." };
  }

  const knownPhone = localStorage.getItem(ORDER_STORAGE.customerPhone);
  const hasValidKnownPhone = /^[6-9]\d{9}$/.test(String(knownPhone || ""));
  if (!hasValidKnownPhone && !extractPhoneFromText(text)) {
    return { valid: false, message: "Please include your 10-digit phone number in the address message for delivery confirmation." };
  }

  return { valid: true, message: "" };
}

function seedCustomerPhoneFromEntry() {
  const params = new URLSearchParams(window.location.search || "");
  const phoneFromQuery = params.get("phone");
  const phoneFromLocal = localStorage.getItem(ORDER_STORAGE.customerPhone);

  if (phoneFromLocal) return;

  const normalized = extractPhoneFromText(phoneFromQuery || "");
  if (normalized) {
    localStorage.setItem(ORDER_STORAGE.customerPhone, normalized);
  }
}

function extractPhoneFromText(text) {
  const normalized = (text || "").replace(/[^0-9+]/g, "");
  const direct = normalized.match(/(?:\+?91)?([6-9]\d{9})/);
  return direct && direct[1] ? direct[1] : null;
}

async function fetchRecentOrdersByPhone(phone, limit = 3) {
  const directUrl = `${SUPABASE_URL}/rest/v1/orders?select=id,items,amount,address,status,created_at,customer_phone&customer_phone=eq.${encodeURIComponent(phone)}&order=created_at.desc&limit=${limit}`;
  let response = await fetch(directUrl, {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    }
  });

  // Fallback for older schema where customer_phone column may not exist.
  if (!response.ok) {
    const fallbackUrl = `${SUPABASE_URL}/rest/v1/orders?select=id,items,amount,address,status,created_at&address=ilike.*${encodeURIComponent(phone)}*&order=created_at.desc&limit=${limit}`;
    response = await fetch(fallbackUrl, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
  }

  if (!response.ok) return null;
  const rows = await response.json();
  if (!Array.isArray(rows) || rows.length === 0) return [];
  return rows;
}

async function startRepeatCustomerPrompt() {
  const phone = localStorage.getItem(ORDER_STORAGE.customerPhone);
  if (!phone) return false;

  try {
    const previousOrders = await fetchRecentOrdersByPhone(phone, 3);
    if (!previousOrders || previousOrders.length === 0) return false;

    repeatState.active = true;
    repeatState.orders = previousOrders.map((order, index) => ({
      ...order,
      _buttonLabel: repeatButtonLabel(order, index)
    }));
    repeatState.selectedOrder = null;
    repeatState.awaitingNewAddress = false;

    const orderButtons = repeatState.orders.map(order => `[${order._buttonLabel}]`).join(" ");
    addMessage(`Welcome back! You are our repeating customer. Here are your previous orders. Choose one to repeat or start a fresh order. ${orderButtons} [Start New Order]`, true);
    return true;
  } catch (error) {
    console.error("Repeat customer prompt failed:", error);
    return false;
  }
}

  }
  return null;

async function saveOrderToBackend(payload) {
  const response = await fetch("http://localhost:5000/api/save-order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    let errorMsg = "Order save failed";
    try {
      const errData = await response.json();
      if (errData && errData.error) errorMsg = errData.error;
    } catch (_) {
      // Keep default message.
    }
    throw new Error(errorMsg);
  }

  return response.json();
}

async function saveOrderWithFallback(payload) {
  try {
    const backendResult = await saveOrderToBackend(payload);
    const orderId = backendResult?.data?.[0]?.id || null;
    return { saved: true, orderId };
  } catch (backendError) {
    console.error("Backend order save failed, trying direct Supabase REST:", backendError);

    const createRestInsert = (bodyPayload) => fetch(`${SUPABASE_URL}/rest/v1/orders`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify(bodyPayload)
    });

    let restResponse = await createRestInsert({ ...payload, status: "Pending" });

    if (!restResponse.ok && payload.customer_phone) {
      // Retry without customer_phone for older schema.
      const retryPayload = { ...payload, status: "Pending" };
      delete retryPayload.customer_phone;
      restResponse = await createRestInsert(retryPayload);
    }

    if (!restResponse.ok) {
      let restError = "Supabase fallback save failed";
      try {
        const errorData = await restResponse.json();
        restError = errorData.message || errorData.error || JSON.stringify(errorData);
      } catch (_) {
        // Keep default.
      }
      throw new Error(restError);
    }

    let orderId = null;
    try {
      const rowData = await restResponse.json();
      if (Array.isArray(rowData) && rowData.length > 0) {
        orderId = rowData[0].id || null;
      }
    } catch (_) {
      // Keep null order id if response parsing fails.
    }

    return { saved: true, orderId };
  }
}

function parseAmountFromText(text) {
  let cleaned = text.replace(/,/g, '');

  // Remove quantity mentions like "2 kg", "3kg", "50 g", "100g" so they don't get mistaken for totals.
  cleaned = cleaned.replace(/\b\d+(?:\.\d+)?\s*(?:kg|kgs|kilogram|kilograms|g|gram|grams|ltr|liter|litre|ml|pcs|pieces|pack|packs|packet|packets)\b/gi, '');

  // Prefer explicit totals with arithmetic expressions, e.g. "total bill is 2000 + 350 = 2350 rupees".
    const explicitSumMatch = cleaned.match(/(?:grand total|final total|amount to pay|amount due|bill amount|total amount|order total|invoice total|total bill|payable amount|total payable|total is|final amount|net amount)[^=]{0,80}=\s*([0-9]+(?:\.[0-9]{1,2})?)/i);
  if (explicitSumMatch && explicitSumMatch[1]) {
      return String(parseFloat(explicitSumMatch[1]) || 0);
  }

  // Prefer explicit total phrases followed by a rupee amount.
    const totalMatches = [...cleaned.matchAll(/(?:grand total|final total|amount to pay|amount due|bill amount|total amount|order total|invoice total|total bill|payable amount|total payable|total is|final amount|net amount).*?([0-9]+(?:\.[0-9]{1,2})?)\s*(?:rupees|INR|Rs|₹)/gi)];
    if (totalMatches.length > 0) {
      const lastMatch = totalMatches[totalMatches.length - 1];
      return String(parseFloat(lastMatch[1]) || 0);
  }

  // Look for rupee amounts after total keywords.
  const rupeeMatches = [...cleaned.matchAll(/([0-9]+(?:\.[0-9]{1,2})?)\s*(?:rupees|INR|Rs|₹)/gi)].map(match => parseFloat(match[1]));
  if (rupeeMatches.length > 0 && hasTotalKeywords(cleaned)) {
      return String(Math.max(...rupeeMatches));
  }

  // Fallback: if the message mentions total, choose the largest number over 10.
  if (hasTotalKeywords(cleaned)) {
      const allNumbers = cleaned.match(/\d+(?:\.\d{1,2})?/g);
      if (allNumbers && allNumbers.length > 0) {
          const numbers = allNumbers.map(n => parseFloat(n)).filter(n => n > 10);
          if (numbers.length > 0) {
              return String(Math.max(...numbers));
          }
      }
  }

  return null;
}

function hasTotalKeywords(text) {
  const cleaned = text.replace(/,/g, '');
  return /(?:total amount|amount to pay|amount due|grand total|final total|bill amount|total bill|order total|invoice total|total is|final amount|net amount|payable amount|total payable|comes to|comes out to|equals?)/i.test(cleaned);
}

function shouldStoreTotal(text) {
  return hasTotalKeywords(text);
}

// Notice handleSend now accepts an optional parameter!
async function handleSend(buttonText = null) {
  const text = buttonText || chatInput.value.trim();
  if (!text) return;

  if (repeatState.active) {
      const pickedOrder = findRepeatOrderByButton(text);
      if (pickedOrder) {
        repeatState.selectedOrder = pickedOrder;
        const oldAddress = pickedOrder.address || "No saved address";
        const amount = parseFloat(pickedOrder.amount || 0);
        addMessage(`You selected order #${pickedOrder.id || '-'} for Rs ${Number.isFinite(amount) ? amount : 0}. Previous address: ${oldAddress}. Would you like to repeat this order? [Yes, Repeat This Order] [No, Start New Order]`, true);
        return;
      }

      if (text === "Yes, Repeat This Order") {
        if (!repeatState.selectedOrder) {
          addMessage("Please choose one previous order first.", true);
          return;
        }

        const order = repeatState.selectedOrder;
        const amount = parseFloat(order.amount || 0);
        if (amount > 10) {
          localStorage.setItem(ORDER_STORAGE.total, String(amount));
          localStorage.setItem(ORDER_STORAGE.finalTotal, String(amount));
        }
        if (order.items) {
          localStorage.setItem(ORDER_STORAGE.pendingItems, String(order.items));
        }
        if (order.address) {
          localStorage.setItem(ORDER_STORAGE.pendingAddress, String(order.address));
          orderDraft.address = String(order.address);
        }

        addMessage(`Great! We found your previous address: ${orderDraft.address || 'No saved address'}. How would you like to continue? [Use Same Address] [Use New Address]`, true);
        return;
      }

      if (text === "Use Same Address") {
        if (!orderDraft.address) {
          addMessage("No previous address found. Please type your new address.", true);
          repeatState.awaitingNewAddress = true;
          orderDraft.expectingAddress = true;
          return;
        }
        addMessage("Perfect. Continuing with your saved address. [Proceed to Payment]", true);
        return;
      }

      if (text === "Use New Address") {
        repeatState.awaitingNewAddress = true;
        orderDraft.expectingAddress = true;
        addMessage("Please type your new delivery address with pincode.", true);
        return;
      }

      if (text === "Start New Order" || text === "No, Start New Order" || text === "Keep Current Order") {
        repeatState.active = false;
        repeatState.awaitingNewAddress = false;
        repeatState.selectedOrder = null;
        localStorage.removeItem(ORDER_STORAGE.repeatPromptShown);
        localStorage.removeItem(ORDER_STORAGE.repeatOrderData);
        addMessage("No problem, starting a fresh order.", true);
        await handleSend("Order Tea");
        return;
      }
  }

  if (text === "Reorder Last") {
      const raw = localStorage.getItem(ORDER_STORAGE.repeatOrderData);
      if (!raw) {
        addMessage("I could not find your previous order details. Please continue with your current order.", true);
        return;
      }

      try {
        const order = JSON.parse(raw);
        const amount = parseFloat(order.amount || 0);
        if (amount > 10) {
          localStorage.setItem(ORDER_STORAGE.total, String(amount));
          localStorage.setItem(ORDER_STORAGE.finalTotal, String(amount));
        }
        if (order.items) {
          localStorage.setItem(ORDER_STORAGE.pendingItems, String(order.items));
        }
        if (order.address) {
          localStorage.setItem(ORDER_STORAGE.pendingAddress, String(order.address));
          orderDraft.address = String(order.address);
          const phone = extractPhoneFromText(order.address);
          if (phone) localStorage.setItem(ORDER_STORAGE.customerPhone, phone);
        }

        addMessage("Previous order loaded. You can now continue to payment or adjust details.", true);
      } catch (_) {
        addMessage("Could not load previous order. Please continue with current order.", true);
      }
      return;
  }

  if (text === "Keep Current Order") {
      addMessage("Great, we will continue with your current order.", true);
      return;
  }

  if (text === "Order Tea") {
      resetOrderState();
  }

    if (TEA_PRICES[text]) {
      orderDraft.pendingTea = text;
    }

    if (text === "50g Box (50 Rupees)") {
      orderDraft.masala = 50;
    }

    if (text === "100g Packet (100 Rupees)") {
      orderDraft.masala = 100;
    }

    if (text === "No, thanks") {
      orderDraft.masala = 0;
    }

    if (!buttonText && orderDraft.pendingTea) {
      const qty = parseKgFromText(text);
      if (qty && qty > 0) {
        orderDraft.items.push({
          name: orderDraft.pendingTea,
          qty,
          pricePerKg: TEA_PRICES[orderDraft.pendingTea]
        });
        orderDraft.pendingTea = null;
      }
    }

  if (!buttonText && !isLikelyActionText(text)) {
      if (orderDraft.expectingAddress) {
        const addressCheck = validateAddressText(text);
        if (!addressCheck.valid) {
          addMessage(addressCheck.message, true);
          return;
        }
        orderDraft.address = text;
        const phone = extractPhoneFromText(text);
        if (phone) {
          localStorage.setItem(ORDER_STORAGE.customerPhone, phone);
        }

        if (repeatState.active && repeatState.awaitingNewAddress) {
          repeatState.awaitingNewAddress = false;
          orderDraft.expectingAddress = false;
          localStorage.setItem(ORDER_STORAGE.pendingAddress, text);
          addMessage("Address updated successfully. [Proceed to Payment]", true);
          return;
        }
      }
      localStorage.setItem(ORDER_STORAGE.pendingAddress, text);
  }

// --- REDIRECTION INTERCEPTOR ---
  if (text === "Proceed to Payment") {
      const aiMessages = chatMain.querySelectorAll('.bg-tea-medium');
      const finalStoredAmount = localStorage.getItem(ORDER_STORAGE.finalTotal);
      const storedAmount = localStorage.getItem(ORDER_STORAGE.total);
      const draftTotal = getOrderDraftTotal();
      let finalAmount = draftTotal > 0
        ? String(draftTotal)
        : ((finalStoredAmount && parseFloat(finalStoredAmount) > 10)
        ? finalStoredAmount
        : ((storedAmount && parseFloat(storedAmount) > 10) ? storedAmount : "0"));

      if (finalAmount === "0" && aiMessages.length > 0) {
              // Search backwards through AI messages to find the bill/total message.
              // We may still need to parse the same message that has "Order saved!".
              for (let i = aiMessages.length - 1; i >= 0; i--) {
                  const msgText = aiMessages[i].innerText;
                  console.log(`Checking message ${i}:`, msgText); // Debug log
              const parsedAmount = parseAmountFromText(msgText);
              if (parsedAmount && parsedAmount !== "0") {
                  finalAmount = parsedAmount;
                  console.log(`Found amount: ${finalAmount} from message:`, msgText); // Debug log
                  break;
              }
          }
      }

      // If still 0, try one more time with all messages and be more aggressive
        if (finalAmount === "0") {
          for (let i = aiMessages.length - 1; i >= 0; i--) {
              const msgText = aiMessages[i].innerText;
              // Look for any number > 50 (likely a total, not a quantity)
              const highNumbers = msgText.match(/\b(\d{2,})\b/g);
              if (highNumbers) {
                  const validNumbers = highNumbers.map(n => parseInt(n)).filter(n => n > 50);
                  if (validNumbers.length > 0) {
                      finalAmount = String(Math.max(...validNumbers));
                      console.log(`Found high number amount: ${finalAmount} from message:`, msgText);
                      break;
                  }
              }
          }
      }

        if ((finalAmount === "0" || !finalAmount) && storedAmount && parseFloat(storedAmount) > 10) {
          finalAmount = storedAmount;
      }

      if (!finalAmount || parseFloat(finalAmount) <= 10) {
          localStorage.removeItem(ORDER_STORAGE.total);
          localStorage.removeItem(ORDER_STORAGE.finalTotal);
          addMessage("I could not detect a valid total amount from the chat bill. Please review the AI response or ask the AI to re-send the final total.", true);
          return;
      }

      console.log(`Final amount to store: ${finalAmount}`); // Debug log
        localStorage.setItem(ORDER_STORAGE.total, finalAmount);
        localStorage.setItem(ORDER_STORAGE.finalTotal, finalAmount);

        // Retry save right before payment in case earlier save failed or was skipped.
        const alreadySaved = localStorage.getItem(ORDER_STORAGE.orderSaved) === "1";
        if (!alreadySaved) {
          const pendingAddress = orderDraft.address || localStorage.getItem(ORDER_STORAGE.pendingAddress) || "Not provided";
          const pendingItems = localStorage.getItem(ORDER_STORAGE.pendingItems) || buildDraftItemsSummary() || getLatestBillTextFromAi();
          const customerPhone = localStorage.getItem(ORDER_STORAGE.customerPhone) || extractPhoneFromText(pendingAddress);
          if (parseFloat(finalAmount) > 10) {
            try {
              const saveResult = await saveOrderWithFallback({
                items: pendingItems,
                amount: parseFloat(finalAmount),
                  address: pendingAddress,
                  customer_phone: customerPhone || null
              });
              localStorage.setItem(ORDER_STORAGE.orderSaved, "1");
              localStorage.setItem(ORDER_STORAGE.paymentStatus, "pending");
              if (saveResult && saveResult.orderId) {
                localStorage.setItem(ORDER_STORAGE.orderId, String(saveResult.orderId));
              }
            } catch (saveError) {
              console.error("Order save retry failed:", saveError);
            }
          }
        }

      addMessage(`Final Total: ₹${finalAmount}. Opening payment...`, true);

      setTimeout(() => {
          window.location.href = "payment.html";
      }, 800);

      return;
  }

    // 4. Save to browser memory
   // localStorage.setItem("intelliTeaTotal", finalAmount);

    //addMessage("Opening secure UPI gateway...", true);
    //setTimeout(() => {
      //  window.location.href = "payment.html";
    //}, 1200);
    //return;


  // If the user clicks the about button, redirect them immediately!
  if (text === "Know About") {
      addMessage("Taking you to our story...", true);
      setTimeout(() => {
          // Change this to your actual about page URL
          window.location.href = "about-page.html"; 
      }, 1500);
     console.log("empty"); 
  }
  // --------------------------------

  addMessage(text, false);
  if (!buttonText) chatInput.value = ''; 

  try {
    const response = await fetch("http://localhost:5000/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (response.ok) {
        addMessage(data.reply, true);
        const parsedAmount = parseAmountFromText(data.reply);
        if (parsedAmount && parseFloat(parsedAmount) > 10 && hasTotalKeywords(data.reply)) {
            localStorage.setItem(ORDER_STORAGE.total, parsedAmount);
        }

        if (/how many kilograms/i.test(data.reply) && orderDraft.pendingTea) {
          // Quantity requested for selected tea; next free-text number will be treated as kg.
        }

        if (/delivery address/i.test(data.reply) && parsedAmount && parseFloat(parsedAmount) > 10) {
            // This prompt is the final bill stage in your flow.
          const draftTotal = getOrderDraftTotal();
          const finalLocked = draftTotal > 0 ? String(draftTotal) : parsedAmount;
          localStorage.setItem(ORDER_STORAGE.finalTotal, finalLocked);
          localStorage.setItem(ORDER_STORAGE.pendingItems, buildDraftItemsSummary());
          orderDraft.expectingAddress = true;
        }

      // When AI confirms order saved, persist the order in Supabase via backend.
      if (data.reply && /order\s*saved/i.test(data.reply)) {
        const draftTotal = getOrderDraftTotal();
        const preferredAmount = draftTotal > 0
          ? String(draftTotal)
          : (localStorage.getItem(ORDER_STORAGE.finalTotal) || localStorage.getItem(ORDER_STORAGE.total) || parsedAmount || "0");
        const orderItems = localStorage.getItem(ORDER_STORAGE.pendingItems) || buildDraftItemsSummary() || getLatestBillTextFromAi();
        const orderAddress = orderDraft.address || localStorage.getItem(ORDER_STORAGE.pendingAddress) || text || "Not provided";
        const customerPhone = localStorage.getItem(ORDER_STORAGE.customerPhone) || extractPhoneFromText(orderAddress);

        if (parseFloat(preferredAmount) > 10) {
          try {
            const saveResult = await saveOrderWithFallback({
              items: orderItems,
              amount: parseFloat(preferredAmount),
              address: orderAddress,
              customer_phone: customerPhone || null
            });
            localStorage.setItem(ORDER_STORAGE.orderSaved, "1");
            localStorage.setItem(ORDER_STORAGE.paymentStatus, "pending");
            if (saveResult && saveResult.orderId) {
              localStorage.setItem(ORDER_STORAGE.orderId, String(saveResult.orderId));
            }
            orderDraft.expectingAddress = false;
          } catch (saveError) {
            console.error("Order save failed:", saveError);
            addMessage("Order save is pending due to a server/database issue. You can still pay, and we will retry saving from payment step.", true);
          }
        }
      }
    } else {
        addMessage("Oops! Server error: " + data.error, true);
    }

  } catch (error) {
    console.error("Connection Error:", error);
    addMessage("Server disconnected?", true);
  }
}

sendBtn.addEventListener('click', () => handleSend());
chatInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSend();
});

// Initial greeting to trigger the AI
window.addEventListener('load', () => {
  seedCustomerPhoneFromEntry();

  // Prevent stale totals/orders from previous completed sessions.
  resetOrderState();

  chatMain.innerHTML = '<div class="flex justify-center"><span class="text-[11px] font-bold text-tea-medium/60 uppercase tracking-widest bg-primary/5 px-3 py-1 rounded-full">Today</span></div>';

  // Silently trigger the backend so it gives us the first buttons immediately
  setTimeout(() => {
     startRepeatCustomerPrompt().then((didShowRepeat) => {
      if (!didShowRepeat) {
        handleSend("Hello");
      }
     });
  }, 500);
});
