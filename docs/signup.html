<!-- Sign Up Form -->
<form class="space-y-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Full Name</label>
<input id="fullName" class="w-full bg-surface-container-lowest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/40 text-on-surface transition-all duration-300 placeholder:text-outline-variant/60" placeholder="Julian Barnes" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label  class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Email Address</label>
<input id="email" class="w-full bg-surface-container-lowest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/40 text-on-surface transition-all duration-300 placeholder:text-outline-variant/60" placeholder="hello@intellitea.com" type="email"/>
</div>
<!-- Password Fields Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label  class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Password</label>
<input id="password" class="w-full bg-surface-container-lowest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/40 text-on-surface transition-all duration-300 placeholder:text-outline-variant/60" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-2">
<label  class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1">Confirm</label>
<input id="confirmPassword" class="w-full bg-surface-container-lowest border-none rounded-xl px-5 py-4 focus:ring-2 focus:ring-primary/40 text-on-surface transition-all duration-300 placeholder:text-outline-variant/60" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-full transition-transform active:scale-95 duration-200 editorial-shadow text-lg" type="submit">
                        Create Account
                    </button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-xs font-bold uppercase tracking-widest text-outline">or</span>

                    Sign Up with Google

<script>
    const supabaseUrl = "https://tmxxjzqzukphngjfkizs.supabase.co";
    const supabaseKey = "sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy";
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('fullName').value;

        const { data, error } = await _supabase.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { full_name: fullName }
            }
        });

        if (error) {
        alert("Signup Error: " + error.message);
    } else {
        alert('Account created! Redirecting to home...');
        
        // THIS IS THE REDIRECT CODE
        window.location.href = 'index.html'; 
    }
    });


</script>
