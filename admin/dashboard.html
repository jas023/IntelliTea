        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB_RjeSJc4Onq2kyDA975W7goJYKS_hq0gB1ABzC20UPu5vlbvuFPuS0hEVVp6spwBRyOmL8yDFnOmlNxbhni9T8-spXgfZ9izCcvSh42Cag2qibOYRPb2bPWrxa9B0k1xRubNBhwaW8fY2W0bT-volAn2KyU2psbhPZLzrhhyeJHLdfd_4A-380zipl_Td2qHuZOlSdFnEM8j4DpQm5SNDuzXTs_Zpm6mPFcj_IY_IX0HhXCm6z5NZx0bFsmarWy3Nen91kJL92uNF');
           
            background-repeat: no-repeat;
            background-size: cover;
            opacity: 0.5; 
            z-index: -1;
        }

            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="font-display bg-background-light text-slate-900 min-h-screen">
    <div class="flex min-h-screen relative">
        <aside class="hidden lg:flex flex-col w-72 bg-white border-r border-primary/10 p-6 fixed h-full z-40">
            <div class="flex items-center gap-3 mb-8 px-2">
                <img src="logo2.png" alt="IntelliTea Logo" class="h-10 w-10 object-contain rounded-lg">
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold tracking-tight text-primary leading-none">IntelliTea</h1>
                    <span class="text-[9px] text-primary/60 font-bold uppercase tracking-tighter">Charan Singh & Sons</span>
                </div>
            </div>

            <nav class="flex-1 space-y-2">
                <a class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-lg shadow-primary/20 transition-all" href="dashboard.html">
                    <!-- <span class="material-symbols-outlined">dashboard</span> -->
                    <span class="font-semibold">Dashboard</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-primary/10 hover:text-primary rounded-xl transition-all" href="order-management.html">
                    <!-- <span class="material-symbols-outlined">package_2</span> -->
                    <span class="font-semibold">Orders</span>
                </a>
                
                <button onclick="handleLogout()" class="flex w-full items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl transition-all mt-10">
                    <!-- <span class="material-symbols-outlined">logout</span> -->
                    <span class="font-semibold">Logout</span>
                </button>
            </nav>

            <div class="mt-auto p-4 bg-primary/5 rounded-2xl border border-primary/10">
                <div class="flex items-center gap-3">
                    <img class="w-10 h-10 rounded-full object-cover" alt="Admin" src="https://ui-avatars.com/api/?name=Admin&background=709c16&color=fff"/>
                    <div>
                        <p id="adminNameDisplay" class="text-sm font-bold">Admin</p>
                        <p class="text-xs text-slate-500">Super User</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 lg:ml-72 flex flex-col relative">
            <div class="absolute inset-0 leaf-pattern pointer-events-none"></div>
            
            <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md px-6 py-4 flex items-center justify-between border-b border-primary/5">
                <h2 class="text-xl font-bold text-slate-800">Main Dashboard</h2>
            </header>

            <div class="p-6 relative z-10">
                <div class="mb-8">
                    <h3 class="text-2xl font-bold text-slate-800">Welcome back!</h3>
                    <p class="text-slate-500">Here is a real-time overview of IntelliTea.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-xl border border-primary/5 shadow-sm">
        <p class="text-slate-500 text-sm font-medium">Total Orders</p>
        <h4 id="realTotalOrders" class="text-2xl font-bold mt-1">0</h4>
    </div>

                    <div class="bg-white p-6 rounded-xl border border-primary/5 shadow-sm">
                        <p class="text-slate-500 text-sm font-medium">Total Earnings</p>
                        <h4 id="totalEarnings" class="text-2xl font-bold mt-1">Rs 0</h4>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-primary/5 shadow-sm">
                        <p class="text-slate-500 text-sm font-medium">Admin Staff</p>
                        <h4 id="adminCount" class="text-2xl font-bold mt-1">0</h4>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-primary/5 shadow-sm">
                        <p class="text-slate-500 text-sm font-medium">Total Complaints</p>
                        <h4 id="complaintsCount" class="text-2xl font-bold mt-1">0</h4>
                    </div>
                </div>

                <div class="bg-white mt-6 rounded-xl border border-primary/5 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-primary/10">
                        <h4 class="text-base font-bold text-slate-800">Recent Complaints</h4>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-slate-50">
                                    <th class="px-5 py-3 text-xs font-bold text-slate-500 uppercase">ID</th>
                                    <th class="px-5 py-3 text-xs font-bold text-slate-500 uppercase">Issue</th>
                                    <th class="px-5 py-3 text-xs font-bold text-slate-500 uppercase">Details</th>
                                    <th class="px-5 py-3 text-xs font-bold text-slate-500 uppercase">Created</th>
                                </tr>
                            </thead>
                            <tbody id="recentComplaintsBody"></tbody>
                        </table>
                    </div>
                </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://tmxxjzqzukphngjfkizs.supabase.co";
        const supabaseKey = "sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy";
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function formatCreatedAt(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString('en-IN');
        }

        function renderComplaints(rows) {
            const tableBody = document.getElementById('recentComplaintsBody');
            if (!tableBody) return;

            if (!Array.isArray(rows) || rows.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-5 py-6 text-sm text-slate-500">No complaints found.</td></tr>';
                return;
            }

            tableBody.innerHTML = '';
            rows.forEach(row => {
                tableBody.innerHTML += `
                    <tr class="border-b border-primary/5 hover:bg-primary/5">
                        <td class="px-5 py-3 text-sm font-semibold text-primary">#${row.id || '-'}</td>
                        <td class="px-5 py-3 text-sm text-slate-700">${row.issue || '-'}</td>
                        <td class="px-5 py-3 text-sm text-slate-700">${row.details || '-'}</td>
                        <td class="px-5 py-3 text-sm text-slate-500">${formatCreatedAt(row.created_at)}</td>
                    </tr>
                `;
            });
        }

        async function loadDashboardData() {
            // 1. Fetch Total Orders
            const { count: orderCount, error: orderError } = await _supabase
                .from('orders')
                .select('*', { count: 'exact', head: true });
            
            if (!orderError) {
                document.getElementById('realTotalOrders').innerText = orderCount || 0;
            }

            // 2. Fetch order values for earnings calculations
            const { data: orders, error: earningsError } = await _supabase
                .from('orders')
                .select('amount');

            if (!earningsError && Array.isArray(orders)) {
                let total = 0;

                orders.forEach(order => {
                    const amount = Number(order.amount) || 0;
                    total += amount;
                });

                const formatRs = (value) => `Rs ${Math.round(value).toLocaleString('en-IN')}`;

                document.getElementById('totalEarnings').innerText = formatRs(total);
            }

            // 3. Fetch Admin Count (from whitelist table)
            const { count: staffCount, error: staffError } = await _supabase
                .from('authorized_admins')
                .select('*', { count: 'exact', head: true });
            
            if (!staffError) {
                document.getElementById('adminCount').innerText = staffCount || 0;
            }

            // 4. Fetch complaints from backend (server credentials) to avoid browser RLS restrictions.
            try {
                const response = await fetch('http://localhost:5000/api/complaints?limit=8');
                const payload = await response.json();

                if (!response.ok || !payload || payload.error) {
                    throw new Error((payload && payload.error) || 'Complaint API failed');
                }

                document.getElementById('complaintsCount').innerText = payload.count || 0;
                renderComplaints(Array.isArray(payload.data) ? payload.data : []);
            } catch (complaintApiError) {
                console.error('Backend complaint fetch failed, falling back to direct query:', complaintApiError);

                let { data: complaints, count: complaintCount, error: complaintError } = await _supabase
                    .from('complaints')
                    .select('id,issue,details,created_at', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .limit(8);

                if (complaintError) {
                    document.getElementById('complaintsCount').innerText = '0';
                    renderComplaints([]);
                } else {
                    document.getElementById('complaintsCount').innerText = complaintCount || 0;
                    renderComplaints(complaints || []);
                }
            }
        }

        async function protectPage() {
            const { data: { user }, error: authError } = await _supabase.auth.getUser();

            if (!user || authError) {
                window.location.href = 'signin.html';
                return;
            }

            const { data, error } = await _supabase
                .from('authorized_admins')
                .select('email')
                .eq('email', user.email)
                .single();

            if (error || !data) {
                alert("Access Denied.");
                await _supabase.auth.signOut();
                window.location.href = 'signin.html';
            } else {
                document.getElementById('adminNameDisplay').innerText = user.email.split('@')[0];
                // Load the stats since we are authorized
                loadDashboardData();
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'signin.html';
        }

        protectPage();
    </script>
</body>
</html>
