</head>
<body class="bg-background-light font-display text-slate-900 min-h-screen">
    <div class="flex flex-col min-h-screen">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-primary/10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-20">
                    <div class="flex items-center gap-4">
                        <img src="logo2.png" alt="IntelliTea Logo" class="h-12 w-12 object-contain rounded-lg shadow-sm">
                        <div class="flex flex-col">
                            <h1 class="text-xl font-bold tracking-tight text-primary leading-none">IntelliTea</h1>
                            <span class="text-[10px] text-primary/60 font-bold uppercase tracking-tighter">Charan Singh & Sons</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <!-- <button class="p-2 text-slate-500 hover:bg-primary/10 rounded-full">
                            <span class="material-symbols-outlined">notifications</span>
                        </button> -->
                        <div class="h-10 w-10 rounded-full bg-primary/20 flex items-center justify-center overflow-hidden border border-primary/30">
                            <img alt="Admin" src="https://ui-avatars.com/api/?name=Admin&background=709c16&color=fff"/>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-primary/10 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-primary/10 text-primary rounded-lg">
                            <span class="material-symbols-outlined">shopping_basket</span>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500">Total Orders</p>
                            <p id="totalOrdersCount" class="text-2xl font-bold">--</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-primary/10 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-amber-100 text-amber-600 rounded-lg">
                            <span class="material-symbols-outlined">pending_actions</span>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500">Pending</p>
                            <p id="pendingOrdersCount" class="text-2xl font-bold">--</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-primary/10 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg">
                            <span class="material-symbols-outlined">check_circle</span>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-500">Delivered</p>
                            <p id="deliveredOrdersCount" class="text-2xl font-bold">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-primary/10 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-primary/10">
                    <h2 class="text-lg font-bold">Orders Management</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50">
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Order ID</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Customer</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Address</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Status</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Payment</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">UTR</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody" class="divide-y divide-slate-100">
                            <tr><td colspan="7" class="p-10 text-center text-slate-400">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="orderModal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-6 border-b border-primary/10 flex justify-between items-center">
            <h3 class="text-xl font-bold text-primary">Order Details</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-red-500">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div id="modalContent" class="p-6 space-y-4">
            </div>
        <div class="p-4 bg-slate-50 text-right">
            <button onclick="closeModal()" class="px-6 py-2 bg-primary text-white font-bold rounded-xl">Close</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://tmxxjzqzukphngjfkizs.supabase.co";
        const supabaseKey = "sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy";
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function extractPhone(text) {
            const normalized = String(text || '').replace(/[^0-9+]/g, '');
            const match = normalized.match(/(?:\+?91)?([6-9]\d{9})/);
            return match && match[1] ? match[1] : null;
        }

        function normalizeOrderStatus(rawStatus) {
            const s = String(rawStatus || '').toLowerCase().trim();
            if (s === 'delivered') return 'delivered';
            return 'pending';
        }

        function normalizePaymentStatus(order) {
            const explicit = String(order.payment_status || '').toLowerCase().trim();
            if (explicit === 'paid') return 'paid';
            if (explicit === 'pending_verification') return 'pending_verification';
            if (explicit === 'pending') return 'pending';

            // Legacy fallback if only status was previously used for payment states.
            const legacy = String(order.status || '').toLowerCase().trim();
            if (legacy === 'paid') return 'paid';
            if (legacy === 'payment submitted' || legacy === 'pending payment' || legacy === 'pending_verification') return 'pending_verification';
            return 'pending';
        }

        function paymentBadgeClass(status) {
            if (status === 'paid') return 'bg-emerald-100 text-emerald-700';
            if (status === 'pending_verification') return 'bg-blue-100 text-blue-700';
            return 'bg-amber-100 text-amber-700';
        }

        function paymentLabel(status) {
            if (status === 'paid') return 'paid';
            if (status === 'pending_verification') return 'pending verification';
            return 'pending';
        }

        async function fetchOrders() {
            console.log("Fetching real data...");
            const { data: orders, error } = await _supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert("Supabase Error: " + error.message);
                return;
            }

            const tableBody = document.getElementById('ordersTableBody');
            tableBody.innerHTML = ''; 

            if (orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="p-10 text-center">No orders found in database.</td></tr>';
            }

           const phoneCounts = {};
           orders.forEach(order => {
               const phone = order.customer_phone || extractPhone(order.address);
               if (phone) {
                   phoneCounts[phone] = (phoneCounts[phone] || 0) + 1;
               }
           });

            orders.forEach(order => {
        const fulfillmentStatus = normalizeOrderStatus(order.status);
        const paymentStatus = normalizePaymentStatus(order);
    const utrNo = order.utr_no || '-';
    const phone = order.customer_phone || extractPhone(order.address);
    const isRepeat = phone && phoneCounts[phone] > 1;
    const customerBadge = isRepeat
        ? '<span class="inline-block ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-blue-100 text-blue-700">Repeat</span>'
        : '<span class="inline-block ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-slate-100 text-slate-600">New</span>';
    const row = `
        <tr class="hover:bg-primary/5 transition-colors border-b border-primary/5">
            <td class="px-6 py-4 whitespace-nowrap font-bold text-primary">#${order.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold">${order.items || 'Tea Order'} ${customerBadge}</td>
            <td class="px-6 py-4 text-sm text-slate-600 max-w-xs truncate">${order.address || 'No Address Provided'}</td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase 
                    ${fulfillmentStatus === 'delivered' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                    ${fulfillmentStatus}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${paymentBadgeClass(paymentStatus)}">
                    ${paymentLabel(paymentStatus)}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-xs font-semibold text-slate-600">${utrNo}</td>
            <td class="px-6 py-4 text-right flex justify-end items-center gap-3">
                ${paymentStatus !== 'paid' ? `
                    <button onclick="markOrderPaid(${order.id})" 
                            class="bg-emerald-600 text-white text-[10px] font-bold px-3 py-1 rounded-full hover:bg-emerald-700 transition-all">
                        MARK PAID
                    </button>
                ` : ''}
                ${fulfillmentStatus !== 'delivered' ? `
                    <button onclick="updateOrderStatus(${order.id}, 'delivered')" 
                            class="bg-primary text-white text-[10px] font-bold px-3 py-1 rounded-full hover:bg-primary/90 transition-all">
                        MARK DELIVERED
                    </button>
                ` : `
                    <span class="text-[10px] text-green-600 font-bold uppercase">Finished</span>
                `}
                
                <button onclick='viewOrder(${JSON.stringify(order)})' class="text-primary font-bold text-xs hover:underline">
                    VIEW
                </button>

                <button onclick="deleteOrder(${order.id})" class="text-red-400 hover:text-red-600">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
            </td>
        </tr>
    `;
    tableBody.innerHTML += row;
});

            // Update stats
            document.getElementById('totalOrdersCount').innerText = orders.length;
            document.getElementById('pendingOrdersCount').innerText = orders.filter(o => normalizeOrderStatus(o.status) !== 'delivered').length;
            document.getElementById('deliveredOrdersCount').innerText = orders.filter(o => normalizeOrderStatus(o.status) === 'delivered').length;
        }

        fetchOrders();

        async function markOrderPaid(orderId) {
    const utrNo = prompt(`Enter UTR/Ref number for Order #${orderId} (optional but recommended):`, "");
    if (utrNo === null) return;

    const payload = {
        payment_status: 'paid',
        utr_no: utrNo.trim() || null,
        payment_verified: true
    };

    let { error } = await _supabase
        .from('orders')
        .update(payload)
        .eq('id', orderId);

    // Fallback for very old schema where payment-specific columns are not added yet.
    if (error) {
        const fallback = await _supabase
            .from('orders')
            .update({ status: 'pending' })
            .eq('id', orderId);
        error = fallback.error;
    }

    if (error) {
        alert("Error marking payment as paid: " + error.message);
        return;
    }

    alert("Order #" + orderId + " marked as paid.");
    fetchOrders();
}

        async function updateOrderStatus(orderId, newStatus) {
    const confirmation = confirm(`Are you sure you want to mark Order #${orderId} as ${newStatus}?`);
    
    if (confirmation) {
        const { error } = await _supabase
            .from('orders')
            .update({ status: newStatus })
            .eq('id', orderId);

        if (error) {
            alert("Error updating order: " + error.message);
        } else {
            alert("Order #" + orderId + " updated to " + newStatus + "!");
            // Refresh the list to show the change
            fetchOrders(); 
        }
    }
}

async function deleteOrder(orderId) {
    if (confirm(`Are you sure you want to delete Order #${orderId}? This cannot be undone.`)) {
        const { error } = await _supabase
            .from('orders')
            .delete()
            .eq('id', orderId);

        if (error) {
            alert("Error: " + error.message);
        } else {
            fetchOrders(); // Refresh table
        }
    }
}

function viewOrder(order) {
    const modal = document.getElementById('orderModal');
    const content = document.getElementById('modalContent');
    
    content.innerHTML = `
        <div class="grid grid-cols-2 gap-4">
            <div><p class="text-xs text-slate-400 uppercase font-bold">Order ID</p><p class="font-semibold">#${order.id}</p></div>
            <div><p class="text-xs text-slate-400 uppercase font-bold">Status</p><p class="font-semibold uppercase text-primary">${normalizeOrderStatus(order.status)}</p></div>
            <div><p class="text-xs text-slate-400 uppercase font-bold">Payment</p><p class="font-semibold uppercase text-primary">${paymentLabel(normalizePaymentStatus(order))}</p></div>
            <div><p class="text-xs text-slate-400 uppercase font-bold">UTR/Ref</p><p class="font-semibold">${order.utr_no || '-'}</p></div>
            <div><p class="text-xs text-slate-400 uppercase font-bold">Phone</p><p class="font-semibold">${order.customer_phone || extractPhone(order.address) || '-'}</p></div>
            <div class="col-span-2"><p class="text-xs text-slate-400 uppercase font-bold">Items Ordered</p><p class="font-semibold">${order.items}</p></div>
            <div class="col-span-2"><p class="text-xs text-slate-400 uppercase font-bold">Delivery Address</p><p class="text-sm">${order.address}</p></div>
            <div class="col-span-2"><p class="text-xs text-slate-400 uppercase font-bold">Order Date</p><p class="text-sm">${new Date(order.created_at).toLocaleString()}</p></div>
        </div>
    `;
    
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeModal() {
    const modal = document.getElementById('orderModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}
    </script>
</body>
