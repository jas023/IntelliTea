<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login | IntelliTea</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#476500",
                        "primary-container": "#5d7f13",
                        "surface": "#fbfbe2",
                        "on-surface": "#1b1d0e",
                    },
                    fontFamily: {
                        "headline": ["Newsreader"],
                        "body": ["Manrope"]
                    }
                }
            }
        }
    </script>
    <style>
        .bg-leafy-overlay {
            background-image: linear-gradient(rgba(251, 251, 226, 0.9), rgba(251, 251, 226, 0.9)), 
            url('https://images.unsplash.com/photo-1544787210-2213d84ad96b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .editorial-shadow { box-shadow: 0 8px 24px -4px rgba(27, 29, 14, 0.06); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col bg-leafy-overlay">

    <header class="fixed top-0 w-full flex items-center justify-center px-6 h-16 bg-surface/80 backdrop-blur-md z-50 border-b border-primary/10">
        <h1 class="font-headline italic font-bold text-2xl tracking-tight text-primary">IntelliTea Admin</h1>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 pt-20 pb-12">
        <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl p-8 editorial-shadow border border-white">
            <div class="text-center mb-10">
                <span class="material-symbols-outlined text-primary text-5xl mb-2">lock_person</span>
                <h2 class="font-headline text-4xl text-on-surface mb-2">Management Portal</h2>
                <p class="text-on-surface-variant text-sm">Please sign in to access the admin dashboard</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-widest text-primary ml-1">Admin Email</label>
                    <input id="email" required class="w-full px-5 py-4 bg-white border-none rounded-2xl ring-1 ring-primary/10 focus:ring-2 focus:ring-primary/40 focus:outline-none transition-all" placeholder="admin@intellitea.com" type="email"/>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-widest text-primary ml-1">Password</label>
                    <input id="password" required class="w-full px-5 py-4 bg-white border-none rounded-2xl ring-1 ring-primary/10 focus:ring-2 focus:ring-primary/40 focus:outline-none transition-all" placeholder="••••••••" type="password"/>
                </div>

                <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Enter Dashboard</span>
                    <span class="material-symbols-outlined text-sm">login</span>
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-primary/10"></div></div>
                <div class="relative flex justify-center text-xs uppercase tracking-widest"><span class="bg-surface px-4 text-slate-400">Secure Access Only</span></div>
            </div>

            <button onclick="signInWithGoogle()" class="w-full py-4 bg-white border border-primary/10 text-on-surface font-semibold rounded-2xl hover:bg-primary/5 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                </svg>
                <span>Google Admin Access</span>
            </button>
        </div>
    </main>

    <footer class="py-6 text-center">
        <p class="text-[10px] uppercase tracking-widest opacity-40">© 2026 IntelliTea • </p>
    </footer>

    <script>
        const supabaseUrl = "https://tmxxjzqzukphngjfkizs.supabase.co";
        const supabaseKey = "sb_publishable_Ei2gtLGHF03W6GQKnblF6Q_fIogWqdy";
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Email/Password Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Login Error: " + error.message);
                return;
            }
            checkAdminAndRedirect(email);
        });

        // 2. Google Login
        async function signInWithGoogle() {
    // Determine the current folder path
    const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
    const redirectUrl = window.location.origin + currentPath + '/dashboard.html';

    const { error } = await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { 
            redirectTo: redirectUrl
        }
    });
    
    if (error) alert("Google Error: " + error.message);
}

        // 3. The Security Gatekeeper
        async function checkAdminAndRedirect(email) {
            const { data, error } = await _supabase
                .from('authorized_admins')
                .select('email')
                .eq('email', email)
                .single();

            if (error || !data) {
                alert("Access Denied: Your email is not on the authorized admin list.");
                await _supabase.auth.signOut();
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // Automatically check for a session (happens after Google redirect)
_supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
        checkAdminAndRedirect(session.user.email);
    }
});
    </script>
</body>
</html>
